bench:
  workload: ycsb
  scale: 1
  weight:
    read: 0.5
    write: 0.5
  population:
    usertable: 2000005
  dist: zipf
  coefficient: 0.9

# Note: The schema block below is not used or parsed at runtime for the YCSB workload.
# The YCSB engine (YCSBStateMachine) uses a dynamic row store, so the number of
# fields is fully dynamic and determined at runtime by the YCSB driver config.
schema:
  - name: usertable
    column:
      - { name: key, type: string, primary: true }
      - { name: field0, type: string }
      - { name: field1, type: string }
      - { name: field2, type: string }
      - { name: field3, type: string }
      - { name: field4, type: string }
      - { name: field5, type: string }
      - { name: field6, type: string }
      - { name: field7, type: string }
      - { name: field8, type: string }
      - { name: field9, type: string }

sharding:
  usertable: MOD

client: { rate: 500, type: open, forwarding: false }
n_concurrent: 1
host:
  janus-lan-server-0000: 127.0.0.1
  janus-lan-server-0100: 127.0.0.1
  janus-lan-server-0200: 127.0.0.1
  janus-lan-proxy-0000: 127.0.0.1
mode: { ab: brq, batch: false, cc: brq, ongoing: 1, retry: 20 }
process:
  janus-lan-server-0000: janus-lan-server-0000
  janus-lan-server-0100: janus-lan-server-0100
  janus-lan-server-0200: janus-lan-server-0200
  janus-lan-proxy-0000: janus-lan-proxy-0000
site:
  client:
    - - janus-lan-proxy-0000
  server:
    - - janus-lan-server-0000:10000
      - janus-lan-server-0100:20000
      - janus-lan-server-0200:30000

server_initial_bound:
  - 100
  - 100
  - 100
server_bound_cap:
  - 400000
  - 400000
  - 400000
designate_replica_id:
  - 0
  - 1
  - 2

clockOffset:
  mean: 0
  std: 0
spec_exec: false
preventive: true
nezha-recorder: 127.0.0.1:41237
owd_delta_us: 10000
owd_estimate_percentile: 50
owdDeltaUs: 10000
